<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf6">
  <title>家庭食用油｜問題批號快查</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* v1.3：保留 v1.2 長輩友善首頁，新增中聯油脂事件時序專頁。 */
    .topbar{height:70px;border-bottom-color:#d9d2c5}.brand{font-size:17px;font-weight:900;letter-spacing:.02em;color:#38342e}.date{color:#625d54;font-size:14px;font-weight:650}.hero{padding:62px 0 36px}.kicker{color:#6a5d4a;font-size:15px;letter-spacing:.08em}.hero h1{font-size:clamp(44px,7vw,64px);line-height:1.16}.issueUnderline{text-decoration-line:underline;text-decoration-color:#b94e4b;text-decoration-thickness:5px;text-underline-offset:8px;text-decoration-skip-ink:none}.privacyPromise{margin-top:28px;display:flex;flex-wrap:wrap;gap:9px 20px;color:#454038;font-size:16px;font-weight:750;line-height:1.6}.privacyPromise span{display:flex;align-items:center;gap:7px}.privacyPromise span::before{content:"✓";color:#655d50;font-weight:950}.branch{padding:26px}.branchHead p{color:#615b52;font-size:14px}.branchHead h2{font-size:32px}.branchDesc{min-height:52px;color:#514c44;font-size:17px}.scanAction{min-height:92px;padding:17px 16px;grid-template-columns:44px 1fr auto;border-radius:16px}.scanAction b{font-size:23px}.scanAction small{margin-top:4px;color:#5f594f;font-size:15px;line-height:1.45}.storyAction{font-size:17px;font-weight:900;color:#413b33}.camellia .storyAction{background:#d8e2d2;color:#4f6145}.how{margin-top:62px;padding-bottom:62px}.how p{color:#554f46;font-size:16px}.how strong{color:#2f2b26;font-size:17px}.footer{padding:22px 0 30px;color:#625d54;font-size:14px;line-height:1.6}.footer strong{color:#3b3731}.back{padding:9px 12px;border:1px solid #ddd0c0;border-radius:10px;background:rgba(255,255,255,.66);font-size:15px}
    @media(max-width:760px){.topbar{height:64px;margin:0 18px}.brand{font-size:15px}.date{font-size:13px}.hero{padding:42px 20px 32px}.hero h1{font-size:44px;line-height:1.2}.kicker{font-size:14px}.privacyPromise{margin-top:25px;gap:7px 16px;font-size:16px}.branch{padding:23px 20px;border-radius:18px}.branchHead p{font-size:14px}.branchHead h2{font-size:30px}.branchDesc{margin:10px 0 17px;font-size:17px}.scanAction{min-height:92px;padding:15px}.scanAction b{font-size:22px}.scanAction small{font-size:15px}.storyAction{padding:13px 14px;font-size:17px}.how{margin:46px 18px 0;padding:27px 0 46px;gap:20px}.how h2{font-size:25px}.how p{font-size:16px}.how strong{font-size:17px}.footer{flex-direction:column;gap:8px;font-size:14px}}
  </style>
</head>
